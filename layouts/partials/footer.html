<footer class="footer bg-light">
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-4">{{ with .Site.GetPage "_footer-left" }}{{ .Content | markdownify }}{{ end }}</div>
      <div class="col-lg-4">{{ with .Site.GetPage "_footer-right" }}{{ .Content | markdownify }}{{ end }}</div>
      <div class="col-lg-4">
        <h4 id="newsletter">{{ .Site.Params.footer.newsletterHeader | default "Newsletter" }}</h4>
        {{/*
          Deliberately a link rather than Substack's <iframe> embed: the embed
          ships its own gold button that clashes with the teal, and being
          cross-origin it cannot be restyled.
        */}}
        <p class="text-muted small">{{ .Site.Params.footer.newsletterText | default "News, events and what we've been reading — straight to your inbox." }}</p>
        {{ with .Site.Params.urls.SubstackUrl }}
          <a href="{{ . }}" class="btn btn-primary">
            <i class="bi-envelope-paper me-2"></i>{{ $.Site.Params.homepage.newsletterButton | default "Subscribe" }}
          </a>
        {{ end }}
      </div>
    </div>

    <hr class="my-4">

    <div class="row align-items-center">
      <div class="col-md-6 text-center text-md-start">
        <p class="text-muted small mb-2 mb-md-0">
          &copy; {{ now.Format "2006" }} {{ .Site.Params.groupinfo.LegalOrgName }}, {{ .Site.Params.groupinfo.OrgLocations }}.
          &middot; <a href="{{ "code-of-conduct" | absLangURL }}">{{ .Site.Params.navbar.CodeOfConduct | default "Code of Conduct" }}</a>
        </p>
      </div>
      <div class="col-md-6 text-center text-md-end social-links">
        <a class="me-3" href="mailto:{{ .Site.Params.groupinfo.ContactEmail }}" aria-label="Email"><i class="bi-envelope-fill fs-3"></i></a>
        {{ with .Site.Params.urls.FacebookUrl }}<a class="me-3" href="{{ . }}" aria-label="Facebook"><i class="bi-facebook fs-3"></i></a>{{ end }}
        {{ with .Site.Params.urls.TwitterUrl }}<a class="me-3" href="{{ . }}" aria-label="Twitter"><i class="bi-twitter fs-3"></i></a>{{ end }}
        {{ with .Site.Params.urls.MeetupUrl }}<a class="me-3" href="{{ . }}" aria-label="Meetup"><i class="bi-calendar3 fs-3"></i></a>{{ end }}
        {{ with .Site.Params.urls.SlackUrl }}<a class="me-3" href="{{ . }}" aria-label="Slack"><i class="bi-slack fs-3"></i></a>{{ end }}
        {{ with .Site.Params.urls.SubstackUrl }}<a href="{{ . }}" aria-label="Newsletter"><i class="bi-newspaper fs-3"></i></a>{{ end }}
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ "js/scripts.js" | absURL }}"></script>
</body>
</html>
